name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest code or commands that show the problem.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package version, PHP version, Symfony version.
    validations:
      required: true
